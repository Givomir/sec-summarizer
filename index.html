<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaBridge — SEC Filing Summarizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:         #0d0f12;
      --surface:    #13161b;
      --border:     #1f2430;
      --accent:     #c8a96e;
      --accent-dim: #8a7048;
      --text:       #e8e2d9;
      --muted:      #6b7280;
      --success:    #4ade80;
      --error:      #f87171;
      --processing: #60a5fa;
      --pending:    #facc15;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Header ───────────────────────────────────────── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 24px 40px;
      display: flex;
      align-items: baseline;
      gap: 16px;
    }
    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem;
      color: var(--accent);
      letter-spacing: 0.02em;
    }
    .logo span { color: var(--muted); font-size: 0.85rem; font-family: 'DM Sans', sans-serif; font-weight: 300; margin-left: 8px; }

    /* ── Layout ───────────────────────────────────────── */
    .layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      min-height: calc(100vh - 73px);
    }

    /* ── Sidebar ──────────────────────────────────────── */
    .sidebar {
      border-right: 1px solid var(--border);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .section-title {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* Submit form */
    .url-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      resize: vertical;
      min-height: 80px;
      outline: none;
      transition: border-color 0.2s;
    }
    .url-input:focus { border-color: var(--accent-dim); }
    .url-input::placeholder { color: var(--muted); }

    .btn-submit {
      margin-top: 10px;
      width: 100%;
      background: var(--accent);
      color: #0d0f12;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-submit:hover { opacity: 0.9; }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

    .submit-error {
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--error);
    }

    /* History list */
    .history-list { display: flex; flex-direction: column; gap: 6px; }

    .history-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .history-item:hover { border-color: var(--accent-dim); }
    .history-item.active { border-color: var(--accent); background: #1a1810; }

    .history-company {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-meta {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .status-dot.pending    { background: var(--pending); }
    .status-dot.processing { background: var(--processing); animation: pulse 1s ease-in-out infinite; }
    .status-dot.completed  { background: var(--success); }
    .status-dot.failed     { background: var(--error); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .empty-hint {
      font-size: 0.78rem;
      color: var(--muted);
      font-style: italic;
    }

    /* ── Main panel ───────────────────────────────────── */
    .main-panel {
      padding: 40px 48px;
      overflow-y: auto;
    }

    .welcome {
      max-width: 560px;
      margin: 60px auto;
      text-align: center;
    }
    .welcome h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .welcome p { color: var(--muted); font-size: 0.9rem; line-height: 1.7; }

    /* Summary card */
    .summary-card { max-width: 820px; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .card-company {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      color: var(--accent);
    }
    .card-tags {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .tag {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .tag.gold { border-color: var(--accent-dim); color: var(--accent); }

    .status-badge {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      padding: 6px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      flex-shrink: 0;
    }
    .status-badge.pending    { background: #2a2510; color: var(--pending); }
    .status-badge.processing { background: #0f1e30; color: var(--processing); }
    .status-badge.completed  { background: #0f2014; color: var(--success); }
    .status-badge.failed     { background: #2a0f0f; color: var(--error); }

    /* Markdown-rendered summary */
    .summary-body { line-height: 1.75; }

    .summary-body h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.1rem;
      color: var(--accent);
      margin: 28px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .summary-body h2:first-child { margin-top: 0; }
    .summary-body p { font-size: 0.88rem; color: var(--text); margin-bottom: 10px; }
    .summary-body ul { padding-left: 18px; margin-bottom: 10px; }
    .summary-body li { font-size: 0.88rem; color: var(--text); margin-bottom: 4px; }
    .summary-body strong { color: var(--accent); font-weight: 500; }

    /* Loading / error states */
    .state-processing {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--processing);
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--processing);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .state-error {
      padding: 20px;
      background: #1a0f0f;
      border: 1px solid #3d1515;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--error);
    }
    .state-error .error-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    .card-url {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      word-break: break-all;
      margin-bottom: 20px;
    }
    .card-url a { color: var(--accent-dim); text-decoration: none; }
    .card-url a:hover { text-decoration: underline; }

    .btn-refresh {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 14px;
      color: var(--muted);
      font-size: 0.78rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-refresh:hover { border-color: var(--accent-dim); color: var(--accent); }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
      .main-panel { padding: 24px 20px; }
      header { padding: 16px 20px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">NovaBridge <span>SEC Filing Summarizer</span></div>
</header>

<div class="layout">

  <!-- ── Sidebar ─────────────────────────────────────── -->
  <aside class="sidebar">

    <div>
      <p class="section-title">Submit Filing URL</p>
      <textarea
        id="urlInput"
        class="url-input"
        placeholder="https://www.sec.gov/Archives/edgar/data/.../aapl-20240928.txt"
      ></textarea>
      <button id="submitBtn" class="btn-submit">Analyse Filing</button>
      <p id="submitError" class="submit-error" style="display:none;"></p>
    </div>

    <div>
      <p class="section-title">Recent Jobs</p>
      <div id="historyList" class="history-list">
        <p class="empty-hint">No filings submitted yet.</p>
      </div>
    </div>

  </aside>

  <!-- ── Main panel ──────────────────────────────────── -->
  <main class="main-panel" id="mainPanel">
    <div class="welcome">
      <h2>Ready to Analyse</h2>
      <p>Paste a SEC EDGAR plain-text filing URL on the left.<br>
         The tool will extract <em>Item 1A — Risk Factors</em> and<br>
         generate a structured analyst summary using Claude.</p>
    </div>
  </main>

</div>

<script>
  const API_BASE = "http://localhost:5000/api/v1";
  let activeId = null;
  let pollTimer = null;

  // ── Utilities ────────────────────────────────────────

  function statusBadge(status) {
    return `<span class="status-badge ${status}">${status}</span>`;
  }

  function statusDot(status) {
    return `<span class="status-dot ${status}"></span>`;
  }

  // Minimal Markdown → HTML (handles ## headings, **bold**, bullets)
  function renderMarkdown(md) {
    return md
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/^[-*] (.+)$/gm, '<li>$1</li>')
      .replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`)
      .replace(/\n{2,}/g, '</p><p>')
      .replace(/^(?!<[hul])(.+)$/gm, '<p>$1</p>')
      .replace(/<p><\/p>/g, '');
  }

  // ── Render summary card ──────────────────────────────

  function renderCard(summary) {
    const company = summary.company_name || "Unknown Company";
    const filingType = summary.filing_type || "—";
    const section = summary.section_extracted || "Item 1A";

    let bodyHtml = "";

    if (summary.status === "processing" || summary.status === "pending") {
      bodyHtml = `
        <div class="state-processing">
          <div class="spinner"></div>
          Fetching and summarising the filing — this may take 30–60 seconds…
        </div>`;
    } else if (summary.status === "failed") {
      bodyHtml = `
        <div class="state-error">
          <p class="error-label">Processing Failed</p>
          <p>${summary.error_message || "An unknown error occurred."}</p>
        </div>`;
    } else if (summary.status === "completed" && summary.summary) {
      bodyHtml = `<div class="summary-body">${renderMarkdown(summary.summary)}</div>`;
    }

    document.getElementById("mainPanel").innerHTML = `
      <div class="summary-card">
        <div class="card-header">
          <div>
            <div class="card-company">${company}</div>
            <div class="card-tags">
              <span class="tag gold">${filingType}</span>
              <span class="tag">${section}</span>
              <span class="tag">ID #${summary.id}</span>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
            ${statusBadge(summary.status)}
            ${(summary.status === "processing" || summary.status === "pending")
              ? `<button class="btn-refresh" onclick="loadSummary(${summary.id})">↻ Refresh</button>`
              : ""}
          </div>
        </div>
        <p class="card-url">
          Source: <a href="${summary.filing_url}" target="_blank" rel="noopener">${summary.filing_url}</a>
        </p>
        ${bodyHtml}
      </div>`;
  }

  // ── Load & poll a summary ────────────────────────────

  async function loadSummary(id, autoPoll = false) {
    if (!autoPoll) {
      activeId = id;
      clearInterval(pollTimer);
    }

    try {
      const resp = await fetch(`${API_BASE}/summaries/${id}`);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      renderCard(data);
      highlightHistory(id);

      // Auto-poll while in-progress
      if (data.status === "pending" || data.status === "processing") {
        if (!autoPoll) {
          pollTimer = setInterval(() => loadSummary(id, true), 3000);
        }
      } else {
        clearInterval(pollTimer);
        loadHistory(); // Refresh sidebar statuses
      }
    } catch (e) {
      console.error(e);
    }
  }

  function highlightHistory(id) {
    document.querySelectorAll(".history-item").forEach(el => {
      el.classList.toggle("active", parseInt(el.dataset.id) === id);
    });
  }

  // ── Load history sidebar ─────────────────────────────

  async function loadHistory() {
    try {
      const resp = await fetch(`${API_BASE}/summaries?page_size=30`);
      if (!resp.ok) return;
      const { items } = await resp.json();
      const list = document.getElementById("historyList");

      if (!items.length) {
        list.innerHTML = '<p class="empty-hint">No filings submitted yet.</p>';
        return;
      }

      list.innerHTML = items.map(s => `
        <div class="history-item${s.id === activeId ? " active" : ""}"
             data-id="${s.id}"
             onclick="loadSummary(${s.id})">
          <span class="history-company">${s.company_name || truncateUrl(s.filing_url)}</span>
          <span class="history-meta">
            ${statusDot(s.status)}
            <span>${s.filing_type || "Unknown"}</span>
            <span>${formatDate(s.created_at)}</span>
          </span>
        </div>`).join("");
    } catch (e) {
      console.error(e);
    }
  }

  function truncateUrl(url) {
    const parts = url.split("/");
    return parts[parts.length - 1] || url;
  }

  function formatDate(iso) {
    if (!iso) return "";
    const d = new Date(iso + (iso.includes("Z") ? "" : "Z"));
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  // ── Submit handler ───────────────────────────────────

  document.getElementById("submitBtn").addEventListener("click", async () => {
    const url = document.getElementById("urlInput").value.trim();
    const errEl = document.getElementById("submitError");
    errEl.style.display = "none";

    if (!url) { showErr("Please enter a filing URL."); return; }
    if (!url.startsWith("http")) { showErr("URL must start with http:// or https://"); return; }

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Submitting…";

    try {
      const resp = await fetch(`${API_BASE}/summaries`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url }),
      });
      const data = await resp.json();
      if (!resp.ok) { showErr(data.error || "Submission failed."); return; }

      document.getElementById("urlInput").value = "";
      await loadHistory();
      clearInterval(pollTimer);
      activeId = data.id;
      await loadSummary(data.id);
    } catch (e) {
      showErr("Could not reach the backend. Is it running on port 5000?");
    } finally {
      btn.disabled = false;
      btn.textContent = "Analyse Filing";
    }
  });

  function showErr(msg) {
    const el = document.getElementById("submitError");
    el.textContent = msg;
    el.style.display = "block";
  }

  // ── Init ─────────────────────────────────────────────
  loadHistory();
</script>

</body>
</html>
