name: Tests and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Clone HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://Givomir:$HF_TOKEN@huggingface.co/spaces/Givomir/sec-summarizer hf_space

      - name: Copy updated files to HF Space
        run: |
          cp main.py hf_space/
          cp database.py hf_space/
          cp repository.py hf_space/
          cp requirements.txt hf_space/
          cp -r services hf_space/
          cp -r tests hf_space/
          cp -r frontend hf_space/

      - name: Commit and push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd hf_space
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git diff --cached --quiet || git commit -m "Deploy from GitHub: ${{ github.sha }}"
          git push https://Givomir:$HF_TOKEN@huggingface.co/spaces/Givomir/sec-summarizer main