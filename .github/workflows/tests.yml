name: Tests and Deploy
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
 
jobs:
  test:
    runs-on: ubuntu-latest
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Install dependencies
        run: pip install -r requirements.txt
 
      - name: Run tests
        run: pytest -v
 
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
 
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
 
      - name: Inject HF Space README
        run: |
          cat > README.md << 'HFEOF'
          ---
          title: SEC Filing Summarizer
          emoji: 📊
          colorFrom: blue
          colorTo: indigo
          sdk: docker
          app_port: 7860
          pinned: false
          ---
 
          # SEC Filing Summarizer
 
          Automated extraction and summarization of SEC EDGAR filings for financial analysts.
 
          ## How to use
 
          Paste a SEC EDGAR filing URL and the tool will extract Item 1A - Risk Factors and generate a structured analyst summary.
 
          ## Sample URLs
 
          | Company | Type | URL |
          |---|---|---|
          | Apple | 10-K 2023 | `https://www.sec.gov/Archives/edgar/data/320193/000032019323000106/aapl-20230930.htm` |
          | Tesla | 10-K 2023 | `https://www.sec.gov/Archives/edgar/data/1318605/000131860524000013/tsla-20231231.htm` |
 
          > Summaries are for informational purposes only and do not constitute investment advice.
          HFEOF
 
      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add README.md
          git commit -m "CI: inject HF Space README" || echo "No changes to commit"
          git push https://Givomir:$HF_TOKEN@huggingface.co/spaces/Givomir/sec-summarizer main --force